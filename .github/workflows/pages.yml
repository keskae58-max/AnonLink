name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  administration: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${BODY}" \
            "${API}")
          echo "POST /pages => HTTP ${CODE}"
          cat /tmp/pages_resp.json
          if [ "${CODE}" = "409" ] || [ "${CODE}" = "422" ]; then
            CODE=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "${BODY}" \
              "${API}")
            echo "PUT /pages => HTTP ${CODE}"
            cat /tmp/pages_resp.json
          fi
          if [ "${CODE}" != "201" ] && [ "${CODE}" != "200" ] && [ "${CODE}" != "204" ]; then
            echo "::warning::Could not auto-enable Pages (HTTP ${CODE}). Enable manually in repo Settings → Pages → gh-pages branch."
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,scripts,README.md,.gitignore,package.json'
