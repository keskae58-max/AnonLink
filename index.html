<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>AnonLink 2026</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <img class="bg-image" src="assets/bg-hero.png" alt="" decoding="async" />
  </div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <script>
    /* Early webview block before paint */
    (function () {
      var ua = navigator.userAgent || '';
      var blocked =
        /Instagram|FBAN|FBAV|FB_IAB|Threads|Barcelona|TikTok|musical_ly|Bytedance|Snapchat|LinkedInApp|; wv\)|WebView/i.test(ua) ||
        (/iPhone|iPad|iPod/i.test(ua) && /AppleWebKit/i.test(ua) && !/Safari/i.test(ua));
      if (blocked) document.documentElement.classList.add('webview-blocked');
    })();
  </script>

  <div id="guard-overlay" class="guard-overlay" hidden>
    <div class="guard-card glass">
      <p class="guard-detected">Detected: <span id="guard-browser">—</span></p>
      <h2>Open Outside WebView</h2>
      <p id="guard-message">For Loading purposes, this page requires to be loaded inside non web view.</p>
      <div class="guard-actions">
        <button type="button" class="glass glass-btn" id="guard-copy">Copy Page Link</button>
      </div>
    </div>
  </div>

  <div id="admin-overlay" class="admin-overlay" hidden>
    <div class="admin-card glass">
      <button type="button" class="glass glass-btn icon-btn" id="admin-close" style="position:absolute;top:1rem;right:1rem;" aria-label="Close">✕</button>
      <form id="admin-login">
        <h2>Admin Access</h2>
        <div class="admin-field">
          <label for="admin-user">Username</label>
          <input type="text" id="admin-user" autocomplete="username" required />
        </div>
        <div class="admin-field">
          <label for="admin-pass">Password</label>
          <input type="password" id="admin-pass" autocomplete="current-password" required />
        </div>
        <button type="submit" class="glass glass-btn">Unlock Config</button>
        <p id="admin-login-error" class="admin-error"></p>
      </form>
      <div id="admin-panel" hidden>
        <h2>Site Config</h2>
        <div class="admin-section">
          <h3>Profile Layer</h3>
          <div class="admin-field">
            <label for="cfg-name">Display Name</label>
            <input type="text" id="cfg-name" />
          </div>
          <div class="admin-field">
            <label for="cfg-desc">Description</label>
            <input type="text" id="cfg-desc" />
          </div>
          <div class="admin-field">
            <label for="cfg-pfp">Profile Image Path</label>
            <input type="text" id="cfg-pfp" />
          </div>
          <div class="admin-field">
            <label for="cfg-channel">Channel URL (stored encoded)</label>
            <input type="text" id="cfg-channel" />
          </div>
        </div>
        <div class="admin-section">
          <h3>Tracking Platforms</h3>
          <div id="cfg-platforms"></div>
        </div>
        <div class="admin-section">
          <h3>Effects</h3>
          <label class="admin-row">
            <input type="checkbox" id="cfg-particles" />
            <span>Particle layer</span>
          </label>
          <div class="admin-field">
            <label for="cfg-blur">Glass blur (px)</label>
            <input type="number" id="cfg-blur" min="4" max="40" />
          </div>
          <div class="admin-field">
            <label for="cfg-stroke">Stroke width (px)</label>
            <input type="number" id="cfg-stroke" min="1" max="3" step="0.5" />
          </div>
          <div class="admin-field">
            <label for="cfg-glow">Glow intensity</label>
            <input type="number" id="cfg-glow" min="0" max="1" step="0.05" />
          </div>
        </div>
        <div class="admin-section">
          <h3>Browser Guard</h3>
          <label class="admin-row">
            <input type="checkbox" id="cfg-chrome" />
            <span>Require Chrome</span>
          </label>
          <label class="admin-row">
            <input type="checkbox" id="cfg-block-inapp" />
            <span>Block in-app social browsers</span>
          </label>
        </div>
        <div class="admin-actions">
          <button type="button" class="glass glass-btn" id="admin-save">Save Config</button>
          <button type="button" class="glass glass-btn" id="admin-reset">Reset to Defaults</button>
          <button type="button" class="glass glass-btn" id="admin-logout">Logout</button>
        </div>
        <p id="admin-save-status" class="admin-status"></p>
      </div>
    </div>
  </div>

  <main class="page" id="main-content">
    <section class="profile-stage">
      <div class="profile-card glass">
        <div class="pfp-ring">
          <img id="profile-pfp" src="assets/pfp-lila.png" alt="LilaVoss" width="160" height="160" />
        </div>
        <h1 class="profile-name" id="profile-name">LilaVoss</h1>
        <p class="profile-desc" id="profile-desc">Join and chat with me here 😘</p>
        <a class="channel-tab glass" id="channel-tab" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open channel">
          <span class="channel-tab-icon">
            <img src="assets/icon-channel.png" alt="" width="36" height="36" />
          </span>
          <span class="channel-tab-label">Connect</span>
        </a>
      </div>
    </section>

    <footer class="brand">AnonLink 2026</footer>
  </main>

  <script src="js/stealth.js"></script>
  <script src="js/browser-guard.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
